name: Check and release UI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Select the next release version
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            npm version patch --no-git-tag-version
          fi
      - run: npm run check
      - name: Pack React library
        run: npm pack --json > pack.json
      - name: Publish versioned npm archive
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          tag="v$version"
          if ! git diff --quiet -- package.json package-lock.json styles/ui.css; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package.json package-lock.json styles/ui.css
            git commit -m "chore: release UI $tag"
            git push origin HEAD:main
          fi
          archive=$(node -p "JSON.parse(require('fs').readFileSync('pack.json','utf8'))[0].filename")
          gh release create "$tag" "$archive" --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --title "UI $tag" --generate-notes
